<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Badge Linear Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Animation Keyframes -->
    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
        50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.9; }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.45; }
        100% { transform: translateY(420px); opacity: 0.1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -100; }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; }
      .scanner-beam { animation: scanline 6s linear infinite; }
      .pill-float-1 { animation: floatSlow 4s ease-in-out infinite; }
      .pill-float-2 { animation: floatFast 5s ease-in-out infinite; }
      .pill-float-3 { animation: floatSlow 4.5s ease-in-out infinite; }
      .path-pulse { stroke-dasharray: 6, 6; animation: dashFlow 20s linear infinite; }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Atmosphere Orbs (Background layer) -->
  <circle cx="200" cy="120" r="280" fill="url(#orbGlow1)" class="orb-1" />
  <circle cx="1020" cy="280" r="320" fill="url(#orbGlow2)" class="orb-2" />
  <circle cx="600" cy="210" r="240" fill="url(#shieldGlow)" class="orb-1" />

  <!-- Dynamic Circuit / Policy Connections in background -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" fill="none" class="path-pulse">
    <path d="M 100 210 Q 250 150, 420 210 T 780 210 T 1100 210" />
    <path d="M 150 100 Q 350 280, 600 130 T 1050 100" />
    <path d="M 120 320 Q 400 180, 650 310 T 1080 320" />
  </g>

  <!-- Scanning beam line across background -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2" class="scanner-beam" />

  <!-- Floating Framework Pills in upper/lower areas -->
  <g class="pill-float-1">
    <rect x="80" y="60" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="145" y="82" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🛡️ SOC 2 TYPE II</text>
  </g>

  <g class="pill-float-2">
    <rect x="980" y="60" width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="1050" y="82" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🔒 ISO 27001:2022</text>
  </g>

  <g class="pill-float-3">
    <rect x="100" y="325" width="120" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="160" y="347" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚖️ GDPR &amp; HIPAA</text>
  </g>

  <g class="pill-float-1">
    <rect x="990" y="325" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="1055" y="347" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ NIST &amp; CIS BENCH</text>
  </g>

  <!-- Central Shield / Security Icon Container in Foreground -->
  <g transform="translate(600, 115)">
    <!-- Outer hexagonal glow ring -->
    <polygon points="0,-45 38,-22 38,22 0,45 -38,22 -38,-22" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2.5" />
    <!-- Checkmark Shield Icon -->
    <path d="M 0 -24 L 20 -14 V 6 C 20 18, 10 26, 0 30 C -10 26, -20 18, -20 6 V -14 Z" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M -8 4 L -2 10 L 10 -4" fill="none" stroke="#10b981" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND TEXT (Strictly clear, crisp and uninterrupted) -->
  <!-- Top Micro Tagline -->
  <text x="600" y="195" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="4">
    GOVERNANCE • RISK MANAGEMENT • AUDIT AUTOMATION
  </text>

  <!-- Main Title -->
  <text x="600" y="248" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
    Awesome Compliance Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="284" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
    Curated Continuous GRC Platforms, Evidence Automation &amp; Star-Ranked Open-Source Tools
  </text>

  <!-- Feature Highlights Row -->
  <g transform="translate(600, 360)">
    <!-- Pill 1: Commercial GRC -->
    <rect x="-310" y="-18" width="190" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="-292" cy="0" r="5" fill="#38bdf8"/>
    <text x="-205" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Enterprise &amp; SaaS GRC</text>

    <!-- Pill 2: Open Source -->
    <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="-82" cy="0" r="5" fill="#10b981"/>
    <text x="10" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Star-Ranked Open Source</text>

    <!-- Pill 3: Transparent Pricing -->
    <rect x="120" y="-18" width="190" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="138" cy="0" r="5" fill="#a855f7"/>
    <text x="225" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Verified Pricing &amp; Limits</text>
  </g>
</svg>
